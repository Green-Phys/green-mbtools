name: Integral symmetry
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symmetry:
    # Keep Python 3.8 on an image with a published interpreter build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: .
      GREEN_RUN_PHYSICAL_SG_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reproducible feature-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev libgmp-dev libmpfr-dev
          python -m pip install 'pyscf==2.14.0' 'green-igen==0.2.8' numpy scipy h5py numba ase spglib packaging pytest green-ac irbasis baryrat setuptools wheel
          python -m pip install --no-deps --no-build-isolation .
      - name: Run symmetry regressions including physical integration
        run: python -m pytest -q tests/test_integral*.py
