# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the docs build (e.g. v1.0.0a0). Defaults to the dispatching ref name."
        required: false
        default: ""

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      
      - name: Install Sphinx and Green-MBTools
        run: |
          python -m pip install --upgrade pip
          sudo apt install libeigen3-dev libgmp-dev libmpfr-dev libfftw3-dev liblapack-dev libblas-dev
          pip install sphinx furo myst-parser sphinx-autodoc-typehints
          pip install .

      - name: Get version label
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "DOC_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "DOC_VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            echo "DOC_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Collect published doc versions
        run: |
          git fetch origin gh-pages --depth=1 || true
          VERSIONS=$(git ls-tree origin/gh-pages --name-only 2>/dev/null \
            | grep -E '^v[0-9]' | tr '\n' ' ' || true)
          echo "DOC_EXISTING_VERSIONS=$VERSIONS" >> "$GITHUB_ENV"

      - name: Build Sphinx docs
        run: sphinx-build -b html docs/ _build/$DOC_VERSION/html

      - name: Deploy to gh-docs branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/${{ env.DOC_VERSION }}/html
          destination_dir: ${{ env.DOC_VERSION }}
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          allow_empty_commit: true

      # Deploy latest to root
      - name: Deploy latest to root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/${{ env.DOC_VERSION }}/html
          destination_dir: ""   # root
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          allow_empty_commit: true